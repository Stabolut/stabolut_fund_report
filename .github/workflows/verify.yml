name: verify

on:
  push:
  pull_request:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Verify dataset hashes & recomputed metrics
        run: |
          python scripts/audit_verifier.py --check
          echo "--- shasum ---"
          shasum -a 256 data/monthly_performance.csv data/monthly_performance.json 2>/dev/null || sha256sum data/monthly_performance.csv data/monthly_performance.json
      - name: Rebuild visuals & PDF (smoke test)
        run: |
          python scripts/generate_visuals.py
          python scripts/generate_calendar_heatmap.py
          python scripts/generate_pdf.py
